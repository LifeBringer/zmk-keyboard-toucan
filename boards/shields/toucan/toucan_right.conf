CONFIG_ZMK_POINTING=y

# The pinnacle driver also requires this to include sleep code
CONFIG_ZMK_MOUSE=y

CONFIG_ZMK_BATTERY_REPORTING=y
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Required to include the touchpad autosleep code.  This saves *lots* of power during use
# but IMO the user experience feels not so great because quite often when you go to use the touchpad
# you need to wait ~300ms for it to wake up.  So for now I'm leaving it off.  I think with just my 
# shutdown mode power savings are probably adequate
# CONFIG_ZMK_INPUT_PINNACLE_IDLE_SLEEPER=y

# Enter deep sleep https://zmk.dev/docs/features/low-power-states
CONFIG_ZMK_SLEEP=y

# Defaults to 15 minutes but 60 minutes is only very slightly more power draw and user experience is much better to not
# have keyboard go to deep sleep (i.e. having to reconenect to bluetooth)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# This is for 'regular' ZMK idle behavior.  Default is 30000 (30 seconds)
# This helps A LOT with touchpad power consumption (only 1.7mA idle vs 2.9mA active).  The only user visible aspect is
# that the touchpad needs 300ms to start seeing touches when next pressed - but this behavior is suppressed if we 
# have pressed a keyboard key within the last 30 seconds (highly likely).
CONFIG_ZMK_IDLE_TIMEOUT=30000

# We use this because we need ZMK_PM, PM_DEVICE and ZMK_PM_DEVICE_SUSPEND_RESUME to get proper sleep notifications into the cirque driver
# since we need all that might as well also turn on SOFT_OFF (which implies all these things but adds an optional SOFT_OFF feature)
CONFIG_ZMK_PM_SOFT_OFF=y

# ─── DIAGNOSTIC BUILD ONLY — remove once the right-half dropout is root-caused ───
#
# Symptom being chased: trackpad AND key matrix both stop responding mid-use, only a
# manual reset of this half recovers it, while the central still holds the BLE link.
# That is the signature of this half's ZMK work queue being wedged rather than a
# link drop, so the telemetry below is aimed at distinguishing "hung" from "crashed"
# from "disconnected".
#
# Tether this half to USB and open the CDC ACM console to read it.
# CONFIG_ZMK_LOG_LEVEL already defaults to 4 (LOG_LEVEL_DBG), so ZMK's split
# connect/disconnect/notification messages -- all LOG_DBG -- are compiled in already.
CONFIG_ZMK_USB_LOGGING=y

# Deferred logging is processed by a low-priority thread, so the exact lines we need
# are the first thing lost when the system wedges. Immediate mode emits synchronously
# from the calling context instead. It blocks and perturbs timing -- accepted here.
CONFIG_LOG_MODE_IMMEDIATE=y

# The thread analyzer runs on its OWN thread and prints every thread's stack
# high-water mark on an interval. That is what separates the three failure modes:
#   still printing while ZMK logs stop -> ZMK work queue deadlocked
#   output stops entirely              -> fault / hard lockup
#   any stack near 100%                -> stack overflow
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=5
CONFIG_THREAD_ANALYZER_USE_PRINTK=y
CONFIG_THREAD_NAME=y
#
# NOTE: USB power suppresses deep sleep entirely (app/src/activity.c gates
# ZMK_ACTIVITY_SLEEP on !is_usb_power_present()). Harmless for this mid-use failure,
# but this tethered build cannot reproduce any sleep-related fault.
# ─────────────────────────────────────────────────────────────────────────────────
